<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cat Eyes</title>
<style>
:root{--bg:#f6f5f2;--fg:#1d1d1f;--muted:#6b6b70;--card:#fff;--line:#d9d7d2;--accent:#c46a1a;--err:#c0392b;--btn:#ecebe7}
@media (prefers-color-scheme: dark){:root{--bg:#121214;--fg:#eceae6;--muted:#8e8e96;--card:#1c1c20;--line:#33333a;--accent:#f0a050;--err:#ff6b5e;--btn:#26262c}}
*{box-sizing:border-box}
[hidden],.hidden{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 12px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--muted);margin:8px 0 4px}
select{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
button{font:inherit;padding:10px 6px;border-radius:8px;border:1px solid var(--line);background:var(--btn);color:var(--fg);cursor:pointer;touch-action:manipulation}
button:active{border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:8px;margin:10px 0 0;color:var(--fg);cursor:pointer}
.check input{width:20px;height:20px;margin:0}
.more{margin-top:8px}
#pad{width:100%;max-width:280px;aspect-ratio:1;margin:0 auto;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle,var(--btn),var(--card));position:relative;touch-action:none;cursor:crosshair}
#dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--accent);left:50%;top:50%;pointer-events:none}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin:8px 0 0}
#status{font-size:.9rem;color:var(--muted);min-height:1.4em}
#err{color:var(--err);font-size:.9rem;min-height:1.4em;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Cat Eyes</h1>

<section>
  <div class="row">
    <div><label for="style">Style</label><select id="style"></select></div>
    <div><label for="iris">Iris</label><select id="iris"></select></div>
  </div>
  <label class="check"><input type="checkbox" id="auto"> Random idle animations</label>
</section>

<section>
  <div class="grid" id="anims"></div>
  <div class="row more">
    <button data-play="blink">Blink</button>
    <button data-play="random">Random</button>
  </div>
</section>

<section>
  <div id="pad"><div id="dot"></div></div>
  <p class="hint">Drag to look</p>
</section>

<div id="status"></div>
<div id="err" role="alert"></div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ui = {
    style: $('style'), iris: $('iris'), auto: $('auto'),
    anims: $('anims'), pad: $('pad'), dot: $('dot'), status: $('status'),
    err: $('err'), special: null
  };
  var meta = null;
  var last = 0, timer = 0, pending = null, dragging = false;


  function setErr(m) { ui.err.textContent = m || ''; }
  function label(s) { return s.replace(/_/g, ' '); }

  function send(body) {
    var r;
    return fetch('/api/eye', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function (res) {
      r = res;
      return res.json().catch(function () { return {}; });
    }).then(function (j) {
      if (r.status === 401) { setErr('Device requires a token: run `auth open` on its console'); return; }
      if (!r.ok) { setErr((j.error && j.error.message) || ('Error ' + r.status)); return; }
      setErr('');
    }, function () { setErr('Network error'); });
  }

  // style, iris and idle choices are remembered by the device
  function withSave(o) { o.save = true; return o; }

  function fill(sel, list) {
    sel.innerHTML = '';
    list.forEach(function (v) {
      var o = document.createElement('option');
      o.value = o.textContent = v;
      sel.appendChild(o);
    });
  }

  function updateSpecial() {
    if (!ui.special || !meta) return;
    var sp = meta.specials[ui.style.value];
    ui.special.hidden = !sp;
    ui.special.textContent = sp ? label(sp) : 'special';
  }

  function buildGrid() {
    ui.anims.innerHTML = '';
    meta.animations.forEach(function (a) {
      var b = document.createElement('button');
      b.dataset.play = a;
      b.textContent = label(a);
      if (a === 'special') ui.special = b;
      ui.anims.appendChild(b);
    });
    updateSpecial();
  }

  function applyState(s) {
    if (!s) return;
    if (s.style && ui.style.value !== s.style) { ui.style.value = s.style; updateSpecial(); }
    if (s.iris) ui.iris.value = s.iris;
    if (typeof s.auto === 'boolean') ui.auto.checked = s.auto;
    ui.status.textContent = 'Style: ' + s.style + '  Iris: ' + s.iris + '  Anim: ' + s.anim;
  }

  function poll() {
    fetch('/api/animations').then(function (r) { return r.json(); }).then(function (j) {
      applyState(j.state);
    }).catch(function () { setErr('Device unreachable'); });
  }

  // Controls
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-play]') : null;
    if (b && !b.hidden) send({ play: b.dataset.play });
  });

  ui.style.onchange = function () { updateSpecial(); send(withSave({ style: ui.style.value })); };
  ui.iris.onchange = function () { send(withSave({ iris: ui.iris.value })); };
  ui.auto.onchange = function () { send(withSave({ auto: ui.auto.checked })); };

  // Look pad
  function padPos(e) {
    var r = ui.pad.getBoundingClientRect();
    var x = Math.max(-1, Math.min(1, (e.clientX - r.left) / r.width * 2 - 1));
    var y = Math.max(-1, Math.min(1, (e.clientY - r.top) / r.height * 2 - 1));
    return [Math.round(x * 100) / 100, Math.round(y * 100) / 100];
  }
  function flush() {
    timer = 0;
    if (!pending) return;
    var p = pending;
    pending = null;
    last = Date.now();
    send({ look: [p[0], p[1], 800] });
  }
  function look(p) {
    ui.dot.style.left = ((p[0] + 1) / 2 * 100) + '%';
    ui.dot.style.top = ((p[1] + 1) / 2 * 100) + '%';
    pending = p;
    if (timer) return;
    var wait = 100 - (Date.now() - last);
    if (wait <= 0) flush(); else timer = setTimeout(flush, wait);
  }
  ui.pad.onpointerdown = function (e) {
    dragging = true;
    ui.pad.setPointerCapture(e.pointerId);
    look(padPos(e));
  };
  ui.pad.onpointermove = function (e) { if (dragging) look(padPos(e)); };
  ui.pad.onpointerup = ui.pad.onpointercancel = function () { dragging = false; };

  // Init
  fetch('/api/animations').then(function (r) { return r.json(); }).then(function (j) {
    meta = j;
    fill(ui.style, j.styles);
    fill(ui.iris, j.irises);
    buildGrid();
    applyState(j.state);
    setInterval(poll, 3000);
  }).catch(function () { setErr('Cannot reach device'); });
})();
</script>
</body>
</html>
