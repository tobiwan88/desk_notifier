<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Desk notifier</title>
<style>
body{font:16px system-ui,sans-serif;max-width:30rem;margin:1rem auto;padding:0 1rem;background:#111;color:#eee}
h1{font-size:1.2rem}.card{background:#1d1d22;border-radius:12px;padding:1rem;margin:1rem 0}
.big{font-size:2.4rem;font-weight:600}.k{color:#999}button{font:inherit;padding:.6rem 1rem;border-radius:8px;border:0;background:#4a7;color:#fff}
pre{white-space:pre-wrap;color:#9a9}
</style></head><body>
<h1>Desk notifier <span class="k" id="host"></span></h1>
<div class="card"><div class="big" id="t">--</div><div id="rest" class="k">waiting for sensor</div>
<p id="lvl"></p><button id="ack">Acknowledge alert</button></div>
<div class="card"><pre id="st"></pre></div>
<script>
async function j(u,o){const r=await fetch(u,o);return r.json()}
async function tick(){
  try{
    const s=await j('/api/sensor');
    document.getElementById('t').textContent=s.ok?s.temp_c.toFixed(1)+' °C':'no sensor';
    document.getElementById('rest').textContent=s.ok?`${s.humidity.toFixed(0)} % RH · ${s.pressure_hpa.toFixed(0)} hPa · gas ${(s.gas_ohm/1000).toFixed(0)} kΩ`:'';
    document.getElementById('lvl').textContent=s.ok?`${s.level} (score ${s.score})`:'';
    const st=await j('/api/status');document.getElementById('host').textContent=st.hostname;
    document.getElementById('st').textContent=JSON.stringify(st,null,1);
  }catch(e){}
}
document.getElementById('ack').onclick=()=>fetch('/api/ack',{method:'POST'});
tick();setInterval(tick,3000);
</script></body></html>
