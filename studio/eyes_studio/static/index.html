<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eyes Studio</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --card:#fff; --ink:#1b1b1a; --mute:#6c6c68; --line:#dcdcd6; --accent:#2a6fd6; --bad:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1e1e1d; --ink:#ececea; --mute:#9a9a95; --line:#34342f; --accent:#6aa0f0; --bad:#ec7063; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, sans-serif; }
  main { max-width:880px; margin:0 auto; padding:16px; display:grid; gap:16px; }
  h1 { font-size:20px; margin:0; } h2 { font-size:15px; margin:0 0 10px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button, select, input { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); } button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  .mute { color:var(--mute); font-size:13px; } .err { color:var(--bad); }
  #pad { width:160px; height:160px; border:1px solid var(--line); border-radius:50%; position:relative; touch-action:none; background:radial-gradient(circle, transparent 60%, color-mix(in srgb, var(--accent) 12%, transparent)); }
  #dot { width:14px; height:14px; border-radius:50%; background:var(--accent); position:absolute; left:73px; top:73px; pointer-events:none; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
  label { display:grid; gap:4px; font-size:13px; color:var(--mute); } label.inline { display:flex; align-items:center; gap:6px; }
  table { width:100%; border-collapse:collapse; } td { padding:6px 4px; border-top:1px solid var(--line); }
  img.preview { width:160px; height:160px; border-radius:50%; background:#000; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:18px; text-align:center; color:var(--mute); }
  #drop.over { border-color:var(--accent); }
  #anims button.special { border-color:var(--accent); }
</style>
</head>
<body>
<main>
  <div class="row"><h1>Eyes Studio</h1><select id="device" aria-label="Device"></select><span id="devinfo" class="mute"></span></div>

  <div class="grid">
    <section class="card">
      <h2>Style</h2>
      <div class="row">
        <label>Style <select id="style"></select></label>
        <label>Iris <select id="iris"></select></label>
      </div>
      <div class="row" style="margin-top:12px">
        <label class="inline"><input type="checkbox" id="save"> save to device</label>
        <label class="inline"><input type="checkbox" id="auto"> random idle</label>
      </div>
    </section>
    <section class="card">
      <h2>Animations</h2>
      <div class="row" id="anims"></div>
      <div class="row" style="margin-top:10px">
        <button data-anim="blink">Blink</button>
        <button data-anim="random">Random</button>
        <button data-anim="special" id="special" hidden></button>
      </div>
      <h2 style="margin-top:14px">Look</h2>
      <div class="row">
        <div id="pad" aria-label="Look pad"><div id="dot"></div></div>
        <span class="mute">drag to look</span>
      </div>
    </section>
  </div>

  <section class="card">
    <h2>New clip</h2>
    <div id="drop">Drop a GIF, PNG zip or video here, or <label style="display:inline"><input type="file" id="file" hidden><u style="cursor:pointer">browse</u></label></div>
    <div class="row" style="margin-top:10px">
      <label>Frame rate <input id="fps" placeholder="auto" size="5"></label>
      <label>Region x,y,w,h <input id="region" placeholder="full screen" size="14"></label>
      <label>Fit <select id="fit"><option>cover</option><option>contain</option></select></label>
      <button id="prepare" disabled>Prepare</button>
    </div>
    <div id="prep" class="row" style="margin-top:12px"></div>
  </section>

  <section class="card">
    <h2>Clips on device</h2>
    <table id="clips"></table>
    <div class="row" style="margin-top:10px"><button id="stop">Stop clips</button><span id="msg" class="mute"></span></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
let prepared = null, file = null, specials = {};
const say = (t, bad) => { $("#msg").textContent = t; $("#msg").className = bad ? "err" : "mute"; };
const dev = () => $("#device").value;
async function api(path, opts = {}) {
  const r = await fetch(path, { headers: opts.body && !(opts.body instanceof FormData) ? {"Content-Type":"application/json"} : {}, ...opts,
    body: opts.body instanceof FormData ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined });
  if (!r.ok) { let m = r.statusText; try { const j = await r.json(); m = j.error?.message || j.detail || m; } catch {} throw new Error(m); }
  return r.status === 204 ? null : r.json();
}
const eye = body => api(`/api/devices/${dev()}/eye`, { method:"POST", body }).catch(e => say(e.message, true));
// style and iris changes are persisted to the device when "save to device" is ticked
const withSave = body => $("#save").checked ? { ...body, save: true } : body;

async function loadDevices() {
  const list = await api("/api/devices");
  const sel = $("#device"), cur = sel.value;
  sel.innerHTML = list.map(d => `<option value="${d.id}">${d.id}</option>`).join("");
  if (cur) sel.value = cur;
  const d = list.find(x => x.id === sel.value);
  $("#devinfo").textContent = !d ? "no devices found" : d.error ? d.error : `${d.status.fps} fps · ${d.status.ip} · ${d.status.rssi} dBm · ${Math.round(d.status.fs_free/1024)} KB free`;
  if (d && !d.error) loadClips();
}
// animation list, styles and irises come from the device; called once per device selection
async function loadAnimations() {
  if (!dev()) return;
  try {
    const a = await api(`/api/devices/${dev()}/animations`);
    specials = a.specials;
    $("#style").innerHTML = a.styles.map(s => `<option>${s}</option>`).join("");
    $("#iris").innerHTML = a.irises.map(s => `<option>${s}</option>`).join("");
    // "blink" has its own button above, so it is left out of the grid
    $("#anims").innerHTML = a.animations.filter(n => n !== "blink").map(n => `<button data-anim="${n}">${n}</button>`).join("");
    $("#style").value = a.state.style; $("#iris").value = a.state.iris; $("#auto").checked = !!a.state.auto;
    renderSpecial();
  } catch (e) { say(e.message, true); }
}
function renderSpecial() {
  const name = specials[$("#style").value];
  $("#special").hidden = !name;
  $("#special").textContent = name || "";
}
async function loadClips() {
  if (!dev()) return;
  try {
    const { clips } = await api(`/api/devices/${dev()}/clips`);
    $("#clips").innerHTML = clips.length ? clips.map(c => `<tr><td><b>${c.name}</b></td><td class="mute">${c.frames} frames · ${c.fps} fps · ${Math.round(c.size/1024)} KB</td>
      <td class="row"><button data-play="${c.name}">Play</button><button data-loop="${c.name}">Loop</button><button data-del="${c.name}">Delete</button></td></tr>`).join("")
      : `<tr><td class="mute">No clips yet.</td></tr>`;
  } catch (e) { say(e.message, true); }
}
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.anim) eye({ play: b.dataset.anim });
  if (b.dataset.play) api(`/api/devices/${dev()}/play`, { method:"POST", body:{ clip:b.dataset.play } }).catch(x => say(x.message, true));
  if (b.dataset.loop) api(`/api/devices/${dev()}/play`, { method:"POST", body:{ clip:b.dataset.loop, loop:true } }).catch(x => say(x.message, true));
  if (b.dataset.del && confirm(`Delete ${b.dataset.del}?`)) { await api(`/api/devices/${dev()}/clips/${b.dataset.del}`, { method:"DELETE" }).catch(x => say(x.message, true)); loadClips(); }
});
$("#stop").onclick = () => api(`/api/devices/${dev()}/stop`, { method:"POST" }).catch(e => say(e.message, true));
$("#style").onchange = e => { eye(withSave({ style: e.target.value })); renderSpecial(); };
$("#iris").onchange = e => eye(withSave({ iris: e.target.value }));
$("#auto").onchange = e => eye({ auto: e.target.checked });
// look pad: a short hold so the eyes stay on the target between updates
const pad = $("#pad"); let down = false, last = 0;
function look(ev) {
  const r = pad.getBoundingClientRect();
  let x = ((ev.clientX - r.left) / r.width) * 2 - 1, y = ((ev.clientY - r.top) / r.height) * 2 - 1;
  const n = Math.hypot(x, y); if (n > 1) { x /= n; y /= n; }
  $("#dot").style.left = (73 + x * 73) + "px"; $("#dot").style.top = (73 + y * 73) + "px";
  const t = performance.now(); if (t - last > 80) { last = t; eye({ look:[+x.toFixed(2), +y.toFixed(2), 800] }); }
}
pad.onpointerdown = e => { down = true; pad.setPointerCapture(e.pointerId); look(e); };
pad.onpointermove = e => down && look(e); pad.onpointerup = () => down = false;
// clip preparation
const drop = $("#drop");
function setFile(f) { file = f; drop.textContent = f ? f.name : "Drop a GIF…"; $("#prepare").disabled = !f; }
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); }; drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); setFile(e.dataTransfer.files[0]); };
$("#file").onchange = e => setFile(e.target.files[0]);
$("#prepare").onclick = async () => {
  const fd = new FormData(); fd.append("file", file); fd.append("device", dev()); fd.append("fit", $("#fit").value);
  if ($("#fps").value) fd.append("fps", $("#fps").value); if ($("#region").value) fd.append("region", $("#region").value);
  $("#prep").textContent = "Preparing…";
  try {
    prepared = await api("/api/prepare", { method:"POST", body: fd });
    $("#prep").innerHTML = `<img class="preview" src="${prepared.preview}" alt="preview"><div style="display:grid;gap:6px">
      <div>${prepared.frames} frames · ${prepared.fps} fps · ${Math.round(prepared.size/1024)} KB</div>
      <div class="mute">${prepared.notes.join("<br>") || "fits the device budget"}</div>
      <div class="row"><input id="cname" placeholder="clip name" size="14" value="${(file.name.split(".")[0] || "clip").toLowerCase().replace(/[^a-z0-9_-]/g,"-").slice(0,31)}"><button class="primary" id="send">Send to device</button></div></div>`;
    $("#send").onclick = async () => {
      try { await api(`/api/devices/${dev()}/clips/${$("#cname").value}`, { method:"POST", body:{ prepared: prepared.id } }); say("uploaded"); loadClips(); }
      catch (e) { say(e.message, true); }
    };
  } catch (e) { $("#prep").innerHTML = `<span class="err">${e.message}</span>`; }
};
$("#device").onchange = () => { loadDevices(); loadAnimations(); };
loadDevices().then(loadAnimations); setInterval(loadDevices, 15000);
</script>
</body>
</html>
