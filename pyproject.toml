[project]
name = "esp-eyes"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
    "zeroconf>=0.151.5",
]

[dependency-groups]
dev = [
    "esp-idf-size>=2.3.2",
    "esptool>=5.5.0",
    "pyserial>=3.5",
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["clipprep", "studio", "tools"]
testpaths = ["clipprep/tests", "studio/tests", "tools/tests"]
